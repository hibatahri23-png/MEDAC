<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explicativo T6</title>
    <style>
        label{
            display: block;
            margin-bottom: 15px;

        }
    </style>
</head>
<body>
    <form action="Proceso.php" method="post">
        <label>
            correo electrónico: <input type="email" placeholder="Correoejemplo@gmail.com" autocomplete="off">
        </label>
        <label>
            Fecha: <input type="date" name="fecha">
        </label>
        <label>
            Hora: <input type="time" name="Hora">
        </label>
        <label>
            Fecha y hora: <input type="datetime-local" name="fechahora">
        </label>
        <label>
            Edad: <input type="number" name="edad" min="10" max="80" step="4">
        </label>
        <label>
            Matricula: <input type="text" name="Matricula" placeholder="1234ABC" title="Formato: 4 números y 3 letras mayusculas" pattern="[0-9]{4}[A-z]{3}">
        </label>
        <label>
            Rango: <input type="range" name="rango" min="0" max="10" value="0" step="0.5">
            <small>0-10</small>
        </label>

        <label>
            Color:
            <input type="color" name="Cuaso">
        </label>

        <label>
            Progreso:
            <progress max="10" value="5"></progress>
            <small>50%</small>
        </label>

        <label>
            Proccés:
            <meter max="10" value="5"></meter>
        </label>
        <button type="submit" name="Enviar">Enviar</button>
    </form>
